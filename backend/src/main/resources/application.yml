spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/babytracker}
    username: ${SPRING_DATASOURCE_USERNAME:bt_user}
    password: ${SPRING_DATASOURCE_PASSWORD:bt_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-prod-min-32chars!!}
    access-expiry-ms: 900000
    refresh-expiry-ms: 604800000
  resend:
    api-key: ${RESEND_API_KEY:}
    from: noreply@babytracker.app
